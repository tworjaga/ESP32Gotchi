name: build

# Builds the ESP32Gotchi firmware and publishes flashable binaries.
# Artifacts (and, on a v* tag, a GitHub Release) contain everything an
# esptool-js web flasher needs: a single merged image to flash at 0x0, plus the
# individual bootloader / partitions / boot_app0 / app parts with their offsets.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pin the toolchain to what the firmware was developed and verified against.
env:
  ESP32_CORE_VERSION: 2.0.17
  U8G2_VERSION: 2.36.19
  ESPTOOL_VERSION: 4.8.1
  FQBN: esp32:esp32:esp32

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
          arduino-cli lib install "U8g2@${U8G2_VERSION}"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "${FQBN}" \
            --warnings all \
            --output-dir build_out \
            Cheapagotchi

      - name: Assemble flashable binaries
        run: |
          python -m pip install --upgrade "esptool==${ESPTOOL_VERSION}"

          # boot_app0.bin ships with the core, not with the sketch build.
          BOOT_APP0="$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin | head -1)"
          test -n "$BOOT_APP0" || { echo "boot_app0.bin not found"; exit 1; }

          VERSION="$(grep -oP '#define[[:space:]]+FW_VERSION[[:space:]]+"\K[^"]+' Cheapagotchi/config.h)"
          echo "Firmware version: ${VERSION}"

          mkdir -p dist
          cp build_out/Cheapagotchi.ino.bootloader.bin dist/bootloader.bin
          cp build_out/Cheapagotchi.ino.partitions.bin dist/partitions.bin
          cp build_out/Cheapagotchi.ino.bin            dist/firmware.bin
          cp "$BOOT_APP0"                              dist/boot_app0.bin

          # Single image for esptool-js: write at flash offset 0x0.
          # keep = preserve the hash-protected bootloader flash settings built
          # by arduino-cli (avoids an esptool "cannot change" warning).
          python -m esptool --chip esp32 merge_bin \
            -o dist/firmware-merged.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x1000  dist/bootloader.bin \
            0x8000  dist/partitions.bin \
            0xe000  dist/boot_app0.bin \
            0x10000 dist/firmware.bin

          # esp-web-tools-style manifest (also documents the offsets for a
          # hand-written esptool-js flasher).
          cat > dist/manifest.json <<EOF
          {
            "name": "ESP32Gotchi",
            "version": "${VERSION}",
            "home_assistant_domain": "",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "firmware-merged.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

          # Offsets for a multi-part flash (esptool-js writeFlash array).
          cat > dist/offsets.txt <<EOF
          Single file (recommended for esptool-js): firmware-merged.bin @ 0x0
          Multi-part:
            0x1000   bootloader.bin
            0x8000   partitions.bin
            0xe000   boot_app0.bin
            0x10000  firmware.bin
          EOF

          {
            echo "### ESP32Gotchi firmware ${VERSION}"
            echo '| File | Flash offset |'
            echo '|------|--------------|'
            echo '| firmware-merged.bin | 0x0 (single-file flash) |'
            echo '| bootloader.bin | 0x1000 |'
            echo '| partitions.bin | 0x8000 |'
            echo '| boot_app0.bin | 0xe000 |'
            echo '| firmware.bin | 0x10000 |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32gotchi-firmware
          path: dist/
          if-no-files-found: error

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
